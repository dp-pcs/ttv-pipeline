# Keyframes through an OpenAI-compatible Images API behind a gateway (for example a TrueFoundry
# deployment), with video on fal MiniMax H3 Max. The key stays in the process environment:
# api_key_env names the variable; no credential belongs in this file.
default_backend: fal
integration_publish_gcs: false
integration_asset_roots:
  - /absolute/path/to/media-project
integration_generate_last_frame: false
image_generation_model: provider-account/gpt-image-model   # the model name the gateway exposes
image_generation_gateway:
  base_url: https://gateway.example.com
  api_key_env: IMAGE_GATEWAY_API_KEY
  default_headers:                      # sent on every request; metadata and logging only
    X-TFY-METADATA: "{}"
    X-TFY-LOGGING-CONFIG: '{"enabled": true}'
  size: 1536x1024                       # requested canvas; output is center-cropped to the scene's delivery aspect
fal:
  model: minimax/h3-max/image-to-video
  default_input:
    resolution: 768P
    prompt_expansion_mode: disabled
    enable_safety_checker: true
remote_api_settings:
  max_retries: 1
  polling_interval: 2
  timeout: 600
